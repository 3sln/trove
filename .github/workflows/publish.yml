name: Publish to npm

# Publishing a release (draft or otherwise) creates its tag and publishes the
# package. Tests run first, so a red build cannot reach the registry.
#
# Trove ships as ONE package: the web app is built here and travels inside the
# tarball, so a consumer runs the server and gets the workbench with it — no
# build step on their side, and no second package to keep in version lockstep.
# That is the thing most of the preflight below is protecting, because every way
# it can go wrong is silent: a tarball missing `dist/` installs perfectly and
# then serves a 404 on `/`, and an unresolvable dependency only fails on someone
# else's machine.
#
# Requires an `NPM_TOKEN` repository secret — an npm automation token with
# publish rights on the @3sln scope.

on:
  release:
    types:
      - published

permissions:
  contents: read
  # Required for npm provenance. Drop this, and the --provenance flag below,
  # if the repository is ever made private: provenance only works for packages
  # published from a public repository.
  id-token: write

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1

      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version."
            echo 'Publishing would ship something other than what the release names.'
            exit 1
          fi
          echo "$TAG matches package.json."

      # Everything checked here is invisible at publish time and only surfaces on
      # a consumer's machine, which is the worst place to find it.
      - name: Check the manifest can be published
        run: |
          set -euo pipefail
          cat > /tmp/preflight.mjs <<'NODE'
          import { readFileSync } from 'node:fs';

          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const problems = [];

          if (pkg.private) {
            problems.push('"private": true — npm refuses to publish this. Remove it.');
          }
          if (!/^@3sln\//.test(pkg.name || '')) {
            // An unscoped `trove` is a different package owned by someone else.
            problems.push(`name is "${pkg.name}" — expected the @3sln scope.`);
          }
          if (pkg.publishConfig?.access !== 'public') {
            problems.push('publishConfig.access is not "public" — a scoped package defaults to restricted.');
          }

          // A dependency that is not a registry range does not install for anyone
          // who is not this repository: a git URL needs GitHub reachable and
          // authenticated at install time, and workspace:/file:/link: resolve to
          // nothing at all once the tarball is unpacked somewhere else.
          const BAD_PROTOCOL = /^(github:|git\+|git:|file:|link:|workspace:|portal:)/;
          for (const field of ['dependencies', 'optionalDependencies', 'peerDependencies']) {
            for (const [name, range] of Object.entries(pkg[field] || {})) {
              if (BAD_PROTOCOL.test(String(range))) {
                problems.push(`${field}.${name} is "${range}" — publish a release of it and depend on a version range.`);
              }
              if (name.startsWith('@trove/')) {
                problems.push(`${field}.${name} is a workspace-only name that is not on the registry.`);
              }
            }
          }

          if (problems.length) {
            for (const p of problems) console.log(`::error::${p}`);
            console.log('\nThe package would install broken. Nothing was published.');
            process.exit(1);
          }
          console.log(`${pkg.name}@${pkg.version} looks publishable.`);
          NODE
          node /tmp/preflight.mjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Before the tests, which need it — see the same step in test.yml — and
      # before packing, because this is the thing being shipped.
      - name: Build the web app
        run: bun run build:web

      - name: Test
        run: bun test

      - name: Show what will be published
        run: npm pack --dry-run

      # `npm pack` decides what to include from `files`/`.npmignore`/`.gitignore`,
      # and `dist/` is gitignored — exactly the kind of interaction that quietly
      # drops the built app from the tarball. So ask the tarball itself rather
      # than trusting the configuration that produced it.
      - name: Check the built web app is actually in the tarball
        run: |
          set -euo pipefail
          npm pack --dry-run --json > /tmp/pack.json
          cat > /tmp/contents.mjs <<'NODE'
          import { readFileSync } from 'node:fs';

          const [tarball] = JSON.parse(readFileSync('/tmp/pack.json', 'utf8'));
          const files = (tarball.files || []).map((f) => f.path);

          // The entry point, the thing it loads, and the hashed assets it names.
          const required = ['packages/web/dist/index.html'];
          const missing = required.filter((f) => !files.includes(f));
          const assets = files.filter((f) => /^packages\/web\/dist\/(assets\/)?.*\.(js|css)$/.test(f));

          if (missing.length || assets.length === 0) {
            for (const f of missing) console.log(`::error::${f} is not in the tarball.`);
            if (!assets.length) console.log('::error::No built JS/CSS under packages/web/dist.');
            console.log('\nThe server would install fine and serve a 404 on `/`. Nothing was published.');
            console.log(`Tarball has ${files.length} files.`);
            process.exit(1);
          }
          console.log(`Tarball: ${files.length} files, ${assets.length} built asset(s), ${(tarball.unpackedSize / 1e6).toFixed(1)} MB unpacked.`);
          NODE
          node /tmp/contents.mjs

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summarise
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          echo "Published $name@$version from $TAG." >> "$GITHUB_STEP_SUMMARY"
