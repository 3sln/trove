name: Test

on:
  push:
  pull_request:

# A branch that gets pushed again mid-run does not need the older run finished.
concurrency:
  group: "test-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Not an optimisation, and not only about shipping: the suite itself needs
      # the built app. `web-dist.test.js` asserts that `findWebDist()` resolves
      # `@trove/web` rather than guessing at the directory layout, and resolution
      # is only reported as found when `dist/` exists — so without this step two
      # tests fail for a reason that has nothing to do with the change under test.
      - name: Build the web app
        run: bun run build:web

      - name: Test
        run: bun test
