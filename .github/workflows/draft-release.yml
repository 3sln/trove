name: Draft Release

# Bumping the version in the root package.json on main opens a draft release for
# it. Nothing is tagged or published at this point — the tag is created by GitHub
# when you publish the draft, which is what triggers publish.yml.
#
# The root package.json is the version for both published packages — @3sln/trove and
# @3sln/create-trove go out together at the same number, so the scaffolder can pin the
# exact drive it was released alongside.
#
# Bump with `npm version patch|minor|major`, which carries the other manifest with it:
# the `version` lifecycle script runs scripts/sync-version.mjs and stages the result, so
# both land in one commit and there is no second edit to remember. A hand-edit that
# forgets is caught by a unit test on every pull request, and again by publish.yml
# before it can reach the registry.

on:
  push:
    branches:
      - main
    paths:
      - package.json
  # For drafting a release without touching package.json, e.g. after a version
  # bump that landed before this workflow existed.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: draft-release
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Release notes are generated by diffing against the previous
          # release, and the version check reads the parent commit.
          fetch-depth: 0

      - name: Work out whether the version changed
        id: version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            echo 'Dispatched manually, not comparing against the parent commit.'
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # First parent, so a squash or merge commit compares against the
          # previous state of main rather than the branch it came from.
          previous="$(git show "${GITHUB_SHA}^:package.json" 2>/dev/null \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).version)}catch{console.log("")}})' \
            || echo '')"

          echo "Previous version: ${previous:-<none>}"
          echo "Current version:  $version"
          if [ "$previous" = "$version" ]; then
            echo 'Version unchanged; package.json was edited for some other reason.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether this version already has a release
        id: existing
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # `gh release list` includes drafts, so re-running this after a bump
          # will not pile up duplicate drafts.
          if gh release list --limit 200 --json tagName --jq '.[].tagName' | grep -Fxq "$TAG"; then
            echo "A release already exists for $TAG."
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists."
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Create the draft release
        if: steps.version.outputs.changed == 'true' && steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --draft \
            --title "$TAG" \
            --generate-notes \
            --target "$GITHUB_SHA"
          echo "Drafted $TAG. Review it, then publish to release to npm." >> "$GITHUB_STEP_SUMMARY"
