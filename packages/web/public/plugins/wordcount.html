<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Trove plugin — Word Count</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #1f2228; color: #d7dce5; }
    .wrap { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    h2 { margin: 0; font-size: 15px; }
    p { margin: 0; color: #9aa4b2; font-size: 12.5px; line-height: 1.5; }
    .count { font-size: 44px; font-weight: 700; text-align: center; background: linear-gradient(135deg, #6ea8fe, #a679f0); -webkit-background-clip: text; background-clip: text; color: transparent; }
    button { font: inherit; padding: 9px 14px; border-radius: 8px; border: 0; cursor: pointer; }
    .primary { background: linear-gradient(180deg, #6ea8fe, #5a8ee0); color: #0b1020; font-weight: 600; }
    .ghost { background: #ffffff14; color: #d7dce5; }
    .row { display: flex; gap: 8px; }
    .row button { flex: 1; }
    small { color: #6b7280; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>📊 Word Count (demo plugin)</h2>
    <p>This runs in a <b>sandboxed iframe</b> and talks to Trove only over a message port. It persists this counter in <b>its own database</b>.</p>
    <div class="count" id="count">0</div>
    <div class="row">
      <button class="primary" id="tap">Count a tap</button>
      <button class="ghost" id="reset">Reset</button>
    </div>
    <small id="status">connecting…</small>
  </div>

  <script type="module">
    // A compact inline implementation of the @trove/plugin-sdk handshake, so the
    // plugin is a single self-hostable file on its own domain. (Real plugins can
    // `import { activate } from '@trove/plugin-sdk'` instead.)
    let port, caps = [], manifest, seq = 0, online = true, silent = false;
    const pending = new Map();
    const commands = {};
    // Live contribution catalog with per-feature offline flags.
    const contribs = { commands: [], openers: [], indexers: [], statusItems: [] };

    const call = (method, params) =>
      new Promise((res, rej) => {
        const id = ++seq;
        pending.set(id, { res, rej });
        port.postMessage({ __trove: 'req', id, method, params });
      });
    const emit = (method, params) => port.postMessage({ __trove: 'event', method, params });
    const buildManifest = () => ({ id: manifest?.id, name: manifest?.name, online, contributions: contribs });
    const announce = () => emit('manifest', buildManifest());

    window.addEventListener('message', (e) => {
      if (e.data?.__trove !== 'init') return;
      manifest = e.data.manifest;
      caps = e.data.capabilities || [];
      online = e.data.online ?? true;
      port = e.ports[0];
      port.onmessage = onPort;
      start();
    });

    function onPort(e) {
      const m = e.data;
      if (m.__trove === 'res') {
        const p = pending.get(m.id);
        if (!p) return;
        pending.delete(m.id);
        m.error ? p.rej(new Error(m.error.message)) : p.res(m.result);
      } else if (m.__trove === 'req') {
        Promise.resolve()
          .then(() => dispatch(m.method, m.params))
          .then((result) => port.postMessage({ __trove: 'res', id: m.id, result }))
          .catch((err) => port.postMessage({ __trove: 'res', id: m.id, error: { message: err.message } }));
      } else if (m.__trove === 'event') {
        if (m.method === 'connectivity') {
          online = !!m.params.online;
          $('status').textContent = online ? 'online' : 'offline (counter still works)';
          announce(); // re-announce so the host sees the updated availability
        }
      }
    }
    // Answering `manifest` proves we're alive; the payload says what works offline.
    const dispatch = (method, params) => {
      if (method === 'command:execute') return commands[params.id]?.(...(params.args || []));
      // When "hung" we stop answering manifest probes — the host's heartbeat then
      // marks us unresponsive and our features become unavailable.
      if (method === 'manifest') {
        if (silent) throw new Error('plugin is not responding');
        return buildManifest();
      }
      return undefined;
    };

    const $ = (id) => document.getElementById(id);
    let count = 0;

    async function start() {
      // Tapping the counter works OFFLINE (state is in the plugin's own DB)…
      commands['wordcount.tap'] = () => tap();
      contribs.commands.push({ id: 'wordcount.tap', title: 'Word Count: Tap', offline: true });
      await call('contribute:command', { id: 'wordcount.tap', title: 'Word Count: Tap', offline: true });
      // …but "sync to cloud" needs the network, so it's marked offline:false.
      commands['wordcount.sync'] = () => emit('ui:toast', { text: online ? 'Synced ☁️' : 'Cannot sync while offline' });
      contribs.commands.push({ id: 'wordcount.sync', title: 'Word Count: Sync to cloud', offline: false });
      await call('contribute:command', { id: 'wordcount.sync', title: 'Word Count: Sync to cloud', offline: false });
      // Test hook: simulate the plugin hanging (stops answering manifest probes).
      commands['wordcount.hang'] = () => { silent = true; };
      contribs.commands.push({ id: 'wordcount.hang', title: 'Word Count: (simulate hang)', offline: true });
      await call('contribute:command', { id: 'wordcount.hang', title: 'Word Count: (simulate hang)', offline: true });

      if (caps.includes('storage')) count = (await call('db:get', { key: 'count' })) || 0;
      render();
      contribs.statusItems.push({ id: 'wordcount.status', offline: true });
      await call('contribute:statusItem', { id: 'wordcount.status', align: 'right', text: `📊 ${count}`, tooltip: 'Word Count taps', command: 'wordcount.tap', offline: true });
      $('status').textContent = 'connected · capabilities: ' + caps.join(', ');
      await call('activated', { ok: true });
      announce(); // publish the initial capability manifest
    }

    async function tap() {
      count++;
      render();
      if (caps.includes('storage')) await call('db:set', { key: 'count', value: count });
      emit('ui:toast', { text: `Tap #${count} recorded`, level: 'info' });
    }
    async function reset() {
      count = 0;
      render();
      if (caps.includes('storage')) await call('db:set', { key: 'count', value: 0 });
    }
    function render() {
      $('count').textContent = String(count);
    }

    $('tap').addEventListener('click', tap);
    $('reset').addEventListener('click', reset);

    // Announce readiness — the host replies with `init` + our message port.
    parent.postMessage({ __trove: 'ready' }, '*');
  </script>
</body>
</html>
